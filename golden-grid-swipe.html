<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Golden Grid — Swipe Animation</title>
<style>
  :root{
    --black:      #050504;
    --grid-size:  56px;
    --cycle:      30s;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--black);
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:100vw; height:100vh;
    background:var(--black);
    isolation:isolate;
  }

  .layer{ position:absolute; inset:0; }

  /* ---------- ambient secondary grid: large cells, faint, slow opposite drift ---------- */
  .grid-fine{
    background-image:
      repeating-linear-gradient(0deg,  rgba(160,160,158,.08) 0, rgba(160,160,158,.08) 1px, transparent 1px, transparent calc(var(--grid-size)*4)),
      repeating-linear-gradient(90deg, rgba(160,160,158,.08) 0, rgba(160,160,158,.08) 1px, transparent 1px, transparent calc(var(--grid-size)*4));
    animation: gridDriftFine var(--cycle) linear infinite;
    z-index:0;
  }

  @keyframes gridDriftFine{
    0%   { background-position: 0 0, 0 0; }
    100% { background-position: calc(var(--grid-size)*-4) calc(var(--grid-size)*-4), calc(var(--grid-size)*-4) calc(var(--grid-size)*-4); }
  }

  /* ---------- base grid: grey lines, visible throughout ---------- */
  .grid-base{
    background-image:
      repeating-linear-gradient(0deg,  rgba(165,165,163,.34) 0, rgba(165,165,163,.34) 1px, transparent 1px, transparent var(--grid-size)),
      repeating-linear-gradient(90deg, rgba(165,165,163,.34) 0, rgba(165,165,163,.34) 1px, transparent 1px, transparent var(--grid-size));
    animation: gridDrift var(--cycle) linear infinite, gridPulse var(--cycle) ease-in-out infinite;
    z-index:1;
  }

  @keyframes gridDrift{
    0%   { background-position: 0 0, 0 0; }
    100% { background-position: var(--grid-size) var(--grid-size), var(--grid-size) var(--grid-size); }
  }

  @keyframes gridPulse{
    0%, 100% { opacity:.85; }
    50%      { opacity:1; }
  }

  /* ---------- swipe glow: an exact bright copy of the base grid, clipped to a
     moving diagonal band so only the line segments inside the band light up ---------- */
  .grid-glow{
    background-image:
      repeating-linear-gradient(0deg,  rgba(255,229,153,.95) 0, rgba(255,229,153,.95) 1px, transparent 1px, transparent var(--grid-size)),
      repeating-linear-gradient(90deg, rgba(255,229,153,.95) 0, rgba(255,229,153,.95) 1px, transparent 1px, transparent var(--grid-size));
    animation: gridDrift var(--cycle) linear infinite, swipeClip var(--cycle) linear infinite, swipeFade var(--cycle) ease-in-out infinite;
    filter: drop-shadow(0 0 2px rgba(255,222,150,.65)) drop-shadow(0 0 7px rgba(255,200,110,.35));
    mix-blend-mode:screen;
    z-index:2;
  }

  /* diagonal band sweeping from fully off-screen left to fully off-screen right;
     values are clip-path polygon x/y percentages of the viewport-sized layer */
  @keyframes swipeClip{
    0%   { clip-path: polygon(-17% 0%, -5% 0%, -11% 100%, -23% 100%); }
    8%   { clip-path: polygon(-6.8% 0%, 5.2% 0%, -0.8% 100%, -12.8% 100%); }
    50%  { clip-path: polygon(47% 0%, 59% 0%, 53% 100%, 41% 100%); }
    92%  { clip-path: polygon(100.8% 0%, 112.8% 0%, 106.8% 100%, 94.8% 100%); }
    100% { clip-path: polygon(111% 0%, 123% 0%, 117% 100%, 105% 100%); }
  }

  @keyframes swipeFade{
    0%   { opacity:0; }
    8%   { opacity:1; }
    92%  { opacity:1; }
    100% { opacity:0; }
  }

  /* ---------- vignette: keeps the black grounded, fades grid at the edges ---------- */
  .vignette{
    z-index:3;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(5,5,4,.55) 78%, rgba(5,5,4,.95) 100%);
    pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    .grid-fine, .grid-base, .grid-glow{ animation:none; }
    .grid-glow{ opacity:0; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="layer grid-fine"></div>
    <div class="layer grid-base"></div>
    <div class="layer grid-glow"></div>
    <div class="layer vignette"></div>
  </div>
</body>
</html>
