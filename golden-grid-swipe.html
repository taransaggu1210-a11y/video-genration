<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Golden Grid</title>
<style>
  :root{
    --black:      #050504;
    --grid-size:  38px;
    --cycle:      30s;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--black);
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:100vw; height:100vh;
    background:var(--black);
    isolation:isolate;
  }

  .layer{ position:absolute; inset:0; }

  /* ---------- ambient secondary grid: large cells, faint, slow opposite drift ---------- */
  .grid-fine{
    background-image:
      repeating-linear-gradient(0deg,  rgba(232,199,106,.06) 0, rgba(232,199,106,.06) 1px, transparent 1px, transparent calc(var(--grid-size)*4)),
      repeating-linear-gradient(90deg, rgba(232,199,106,.06) 0, rgba(232,199,106,.06) 1px, transparent 1px, transparent calc(var(--grid-size)*4));
    animation: gridDriftFine var(--cycle) linear infinite;
    z-index:0;
  }

  @keyframes gridDriftFine{
    0%   { background-position: 0 0, 0 0; }
    100% { background-position: calc(var(--grid-size)*-4) calc(var(--grid-size)*-4), calc(var(--grid-size)*-4) calc(var(--grid-size)*-4); }
  }

  /* ---------- base grid: golden lines, visible throughout ---------- */
  .grid-base{
    background-image:
      repeating-linear-gradient(0deg,  rgba(215,178,96,.32) 0, rgba(215,178,96,.32) 1px, transparent 1px, transparent var(--grid-size)),
      repeating-linear-gradient(90deg, rgba(215,178,96,.32) 0, rgba(215,178,96,.32) 1px, transparent 1px, transparent var(--grid-size));
    animation: gridDrift var(--cycle) linear infinite, gridPulse var(--cycle) ease-in-out infinite;
    z-index:1;
  }

  @keyframes gridDrift{
    0%   { background-position: 0 0, 0 0; }
    100% { background-position: var(--grid-size) var(--grid-size), var(--grid-size) var(--grid-size); }
  }

  @keyframes gridPulse{
    0%, 100% { opacity:.85; }
    50%      { opacity:1; }
  }

  /* ---------- vignette: keeps the black grounded, fades grid at the edges ---------- */
  .vignette{
    z-index:3;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(5,5,4,.55) 78%, rgba(5,5,4,.95) 100%);
    pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    .grid-fine, .grid-base{ animation:none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="layer grid-fine"></div>
    <div class="layer grid-base"></div>
    <div class="layer vignette"></div>
  </div>
</body>
</html>
