<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Golden Gradient Grid</title>
<style>
  :root{
    --black:      #050504;
    --grid-size:  38px;
    --cycle:      30s;
  }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--black);
    overflow:hidden;
  }

  .stage{
    position:relative;
    width:100vw; height:100vh;
    background:var(--black);
    isolation:isolate;
  }

  .layer{ position:absolute; inset:0; }

  /* ---------- ambient secondary grid: large cells, faint, drifting the opposite way ---------- */
  .grid-fine{
    background: linear-gradient(115deg, #4a2f0c 0%, #cdb968 24%, #fff2cf 48%, #e0a53e 66%, #4a2f0c 100%);
    background-size: 260% 260%;
    -webkit-mask-image:
      repeating-linear-gradient(0deg,  black 0, black 1px, transparent 1px, transparent calc(var(--grid-size)*4)),
      repeating-linear-gradient(90deg, black 0, black 1px, transparent 1px, transparent calc(var(--grid-size)*4));
    mask-image:
      repeating-linear-gradient(0deg,  black 0, black 1px, transparent 1px, transparent calc(var(--grid-size)*4)),
      repeating-linear-gradient(90deg, black 0, black 1px, transparent 1px, transparent calc(var(--grid-size)*4));
    opacity:.28;
    animation: maskDriftFine var(--cycle) linear infinite, gradientShift calc(var(--cycle)*1.4) ease-in-out infinite;
    z-index:0;
  }

  @keyframes maskDriftFine{
    0%   { -webkit-mask-position: 0 0, 0 0;       mask-position: 0 0, 0 0; }
    100% { -webkit-mask-position: calc(var(--grid-size)*-4) calc(var(--grid-size)*-4), calc(var(--grid-size)*-4) calc(var(--grid-size)*-4);
           mask-position: calc(var(--grid-size)*-4) calc(var(--grid-size)*-4), calc(var(--grid-size)*-4) calc(var(--grid-size)*-4); }
  }

  /* ---------- base grid: lines filled with a moving golden gradient ---------- */
  .grid-base{
    background: linear-gradient(115deg, #5c3a10 0%, #cdb968 22%, #fff3d2 45%, #f0b94a 62%, #7a4a12 82%, #cdb968 100%);
    background-size: 300% 300%;
    -webkit-mask-image:
      repeating-linear-gradient(0deg,  black 0, black 1px, transparent 1px, transparent var(--grid-size)),
      repeating-linear-gradient(90deg, black 0, black 1px, transparent 1px, transparent var(--grid-size));
    mask-image:
      repeating-linear-gradient(0deg,  black 0, black 1px, transparent 1px, transparent var(--grid-size)),
      repeating-linear-gradient(90deg, black 0, black 1px, transparent 1px, transparent var(--grid-size));
    filter: drop-shadow(0 0 1.4px rgba(255,224,150,.55));
    animation: maskDrift var(--cycle) linear infinite, gradientShift var(--cycle) ease-in-out infinite;
    z-index:1;
  }

  @keyframes maskDrift{
    0%   { -webkit-mask-position: 0 0, 0 0;                                   mask-position: 0 0, 0 0; }
    100% { -webkit-mask-position: var(--grid-size) var(--grid-size), var(--grid-size) var(--grid-size);
           mask-position: var(--grid-size) var(--grid-size), var(--grid-size) var(--grid-size); }
  }

  /* the gold flows across the grid: amber -> bright gold -> pale cream -> amber, back and forth */
  @keyframes gradientShift{
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ---------- vignette: keeps the black grounded, fades grid at the edges ---------- */
  .vignette{
    z-index:3;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(5,5,4,.55) 78%, rgba(5,5,4,.95) 100%);
    pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    .grid-fine, .grid-base{ animation:none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="layer grid-fine"></div>
    <div class="layer grid-base"></div>
    <div class="layer vignette"></div>
  </div>
</body>
</html>
